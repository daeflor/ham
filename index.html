<html>
<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>

<head>
    <style>
        body {
            margin: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #status {
            margin: 8px 0 16px;
            white-space: pre-wrap;
        }

        #layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
        }

        #playlistList {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 6px;
        }

        .playlistButton {
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            cursor: pointer;
        }

        .playlistButton.selected {
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border-bottom: 1px solid #ddd;
            padding: 8px 6px;
            vertical-align: top;
        }

        th {
            text-align: left;
        }

        td.len {
            white-space: nowrap;
        }

        #pagination {
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #pagination[hidden] {
            display: none;
        }

        #pagination button {
            padding: 6px 12px;
            cursor: pointer;
        }

        #pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #pageInfo {
            font-size: 14px;
            color: #666;
        }
    </style>

    <script type="module" src='./scripts/app.js'></script>
</head>

<body>
    <h1>Apple Music Scraper</h1>
    <div id="status" hidden></div>

    <div id="layout">
        <section>
            <h2>Playlists</h2>
            <ul id="playlistList"></ul>
        </section>

        <section>
            <h2 id="playlistTitle">Tracks</h2>
            <div id="tracksEmpty">Select a playlist to view tracks.</div>
            <table id="tracksTable" hidden>
                <thead>
                    <tr>
                        <th>Track</th>
                        <th>Artist</th>
                        <th>Album</th>
                        <th>Length</th>
                    </tr>
                </thead>
                <tbody id="tracksBody"></tbody>
            </table>
            <div id="pagination" hidden>
                <button id="prevPage" type="button">Previous</button>
                <span id="pageInfo"></span>
                <button id="nextPage" type="button">Next</button>
            </div>
        </section>
    </div>

</body>

</html>
