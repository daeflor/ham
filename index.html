<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js"
            }
        }
    </script>
    <link rel="stylesheet" href="./styles/styles.css" />

    <script type="module" src='./scripts/app.js'></script>
</head>

<body>
    <main class="page">
        <section class="hero" id="landingShell">
            <div class="heroGrid">
                <div class="heroCopy">
                    <h1 id="landingTitle">Hello Apple Music</h1>
                    <div class="landingCtaSlot">
                        <div id="landingActions" class="heroActions">
                            <button id="connectButton" class="primaryButton" type="button">Sign into Firebase & load
                                Apple Music
                                playlists</button>
                        </div>
                        <div id="landingStatus" class="landingStatus"></div>
                    </div>
                </div>

            </div>
        </section>

        <section id="appShell" class="appShell" hidden>
            <div id="status" hidden></div>

            <div id="layout" class="workspaceShell">
                <div class="leftRail">
                    <div class="playlistToolbar">
                        <div id="firebaseSession" class="firebaseSession" hidden>
                            <span id="firebaseUser" class="firebaseUser"></span>
                            <button id="firebaseSignOutButton" class="iconButton" type="button" title="Sign out">
                                <svg viewBox="0 0 24 24">
                                    <path
                                        d="M15 3h-4a3 3 0 0 0-3 3v2h2V6a1 1 0 0 1 1-1h4zm-1 6 1.41 1.41-1.58 1.59H21v2h-7.17l1.58 1.59L14 17l-4-4zm-6 1H3v8a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3v-2h-2v2a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8h3z" />
                                </svg>
                            </button>
                        </div>
                        <button id="togglePlaylistsButton" class="iconButton playlistCollapseButton" type="button"
                            title="Collapse playlists">
                            <svg viewBox="0 0 24 24">
                                <path d="m15 18-6-6 6-6 1.4 1.4-4.6 4.6 4.6 4.6z" />
                            </svg>
                        </button>
                    </div>
                    <section id="playlistPanel" class="panel playlistPanel">
                        <div class="panelHeading">
                            <h2>Playlists</h2>
                            <p id="playlistCount">Load your Apple Music library</p>
                        </div>
                        <ul id="playlistList"></ul>
                    </section>
                </div>

                <section class="panel detailPanel" id="detailPanel" hidden>
                    <div class="selectionCard">
                        <div class="selectionHeader">
                            <h2 id="selectionTitle"></h2>
                            <div class="selectionTransferState">
                                <button id="selectedTransferButton" class="secondaryButton selectionTransferButton"
                                    type="button">Transfer</button>
                                <span id="selectedTransferredBadge" class="selectedTransferredBadge"
                                    hidden>Transferred</span>
                            </div>
                        </div>
                    </div>

                    <div class="actionTabs">
                        <button id="showAppleTracksButton" class="actionTab" type="button">
                            <span class="actionTabTitle">Apple Music tracks</span>
                        </button>
                        <button id="showYoutubeTracksButton" class="actionTab" type="button">
                            <span class="actionTabTitle">YouTube Music tracks</span>
                        </button>
                        <button id="showYoutubeComparisonButton" class="actionTab" type="button">
                            <span class="actionTabTitle">Apple Music vs YouTube Music</span>
                        </button>
                        <button id="showAppleTrackComparisonButton" class="actionTab" type="button" disabled
                            title="Coming soon">
                            <span class="actionTabTitle">Apple Music comparison</span>
                        </button>
                    </div>

                    <section id="tracksView" hidden>
                        <div class="contentHeader">
                            <div>
                                <p id="trackSummary">Track data will appear here.</p>
                            </div>
                            <div class="contentActions">
                                <button id="copyTracksButton" class="secondaryButton" type="button" disabled>Copy full
                                    tracklist</button>
                                <div id="copyFeedback" class="copyFeedback"></div>
                            </div>
                        </div>

                        <table id="tracksTable" hidden>
                            <thead>
                                <tr>
                                    <th class="trackIndexHeader">#</th>
                                    <th>Track</th>
                                    <th>Artist</th>
                                    <th>Album</th>
                                    <th>Length</th>
                                </tr>
                            </thead>
                            <tbody id="tracksBody"></tbody>
                        </table>
                        <div id="pagination" hidden>
                            <button id="prevPage" type="button">Previous</button>
                            <span id="pageInfo"></span>
                            <button id="nextPage" type="button">Next</button>
                        </div>
                    </section>

                    <section id="comparisonView" class="comparisonView" hidden>
                        <div class="comparisonHeader">
                            <div class="comparisonActions">
                                <label class="comparisonOption">
                                    <input id="ignoreCapitalizationCheckbox" type="checkbox" />
                                    <span>Ignore capitalization</span>
                                </label>
                                <label class="comparisonOption">
                                    <input id="ignoreAlbumMatchingCheckbox" type="checkbox" />
                                    <span>Ignore album matching</span>
                                </label>
                                <label class="comparisonOption">
                                    <input id="ignoreParentheticalsCheckbox" type="checkbox" />
                                    <span>Ignore parens</span>
                                </label>
                                <button id="copyComparisonButton" class="iconButton" type="button"
                                    title="Copy comparison">
                                    <svg viewBox="0 0 24 24">
                                        <path
                                            d="M9 3h6a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-1H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 3h6V5H9zm-4 9h1V8a2 2 0 0 1 2-2h7V5H5zm3-7v11h10V8z" />
                                    </svg>
                                </button>
                                <div id="comparisonStatus" class="copyFeedback"></div>
                            </div>
                        </div>

                        <div class="comparisonColumns">
                            <section class="comparisonColumn removed">
                                <div class="comparisonColumnHeading">
                                    <span class="comparisonColumnIcon">-</span>
                                    <h3>Removed</h3>
                                    <span id="removedComparisonCount" class="comparisonCount"></span>
                                    <div class="comparisonScrollControls">
                                        <button class="comparisonScrollButton" type="button"
                                            data-comparison-scroll="removed" data-scroll-direction="-1"
                                            title="Scroll up one track">
                                            <svg viewBox="0 0 24 24">
                                                <path d="m7 14 5-5 5 5z" />
                                            </svg>
                                        </button>
                                        <button class="comparisonScrollButton" type="button"
                                            data-comparison-scroll="removed" data-scroll-direction="1"
                                            title="Scroll down one track">
                                            <svg viewBox="0 0 24 24">
                                                <path d="m7 10 5 5 5-5z" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div id="removedComparisonList" class="comparisonTrackList"></div>
                            </section>

                            <section class="comparisonColumn added">
                                <div class="comparisonColumnHeading">
                                    <span class="comparisonColumnIcon">+</span>
                                    <h3>Added</h3>
                                    <span id="addedComparisonCount" class="comparisonCount"></span>
                                    <div class="comparisonScrollControls">
                                        <button class="comparisonScrollButton" type="button"
                                            data-comparison-scroll="added" data-scroll-direction="-1"
                                            title="Scroll up one track">
                                            <svg viewBox="0 0 24 24">
                                                <path d="m7 14 5-5 5 5z" />
                                            </svg>
                                        </button>
                                        <button class="comparisonScrollButton" type="button"
                                            data-comparison-scroll="added" data-scroll-direction="1"
                                            title="Scroll down one track">
                                            <svg viewBox="0 0 24 24">
                                                <path d="m7 10 5 5 5-5z" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                                <div id="addedComparisonList" class="comparisonTrackList"></div>
                            </section>
                        </div>
                    </section>
                </section>
            </div>
        </section>
    </main>

    <template id="comparisonTrackTemplate">
        <article class="comparisonTrack">
            <div class="comparisonTrackIndex" data-track-field="playlistIndex"></div>
            <div class="comparisonTrackBody">
                <div class="comparisonTrackTitle" data-track-field="title"></div>
                <div class="comparisonTrackMeta" data-track-field="artist"></div>
                <div class="comparisonTrackMeta" data-track-field="album"></div>
                <div class="comparisonTrackMeta" data-track-field="duration"></div>
            </div>
        </article>
    </template>
</body>

</html>
