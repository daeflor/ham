<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" data-web-components async></script>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js"
            }
        }
    </script>
    <link rel="stylesheet" href="./styles/styles.css" />

    <script type="module" src='./scripts/app.js'></script>
</head>

<body>
    <main class="page">
        <section class="hero" id="landingShell">
            <div class="heroGrid">
                <div class="heroCopy">
                    <h1 id="landingTitle">Hello Apple Music</h1>
                    <div class="landingCtaSlot">
                        <div id="landingActions" class="heroActions">
                            <button id="connectButton" class="primaryButton" type="button">Show Apple Music
                                playlists</button>
                        </div>
                        <div id="landingStatus" class="landingStatus" aria-live="polite"></div>
                    </div>
                </div>

            </div>
        </section>

        <section id="appShell" class="appShell" hidden>
            <div id="status" hidden></div>

            <div id="layout" class="workspaceShell">
                <div class="leftRail">
                    <div class="playlistToolbar">
                        <button id="firebaseButton" class="secondaryButton" type="button" disabled
                            title="Requires Google Firebase sign-in support">
                            Sign into Google Firebase
                        </button>
                        <div id="firebaseSession" class="firebaseSession" hidden>
                            <span id="firebaseUser" class="firebaseUser" aria-live="polite"></span>
                            <button id="firebaseSignOutButton" class="iconButton" type="button" aria-label="Sign out"
                                title="Sign out">
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path
                                        d="M15 3h-4a3 3 0 0 0-3 3v2h2V6a1 1 0 0 1 1-1h4zm-1 6 1.41 1.41-1.58 1.59H21v2h-7.17l1.58 1.59L14 17l-4-4zm-6 1H3v8a3 3 0 0 0 3 3h9a3 3 0 0 0 3-3v-2h-2v2a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8h3z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <section class="panel playlistPanel">
                        <div class="panelHeading">
                            <h2>Playlists</h2>
                            <p id="playlistCount">Load your Apple Music library</p>
                        </div>
                        <ul id="playlistList"></ul>
                    </section>
                </div>

                <section class="panel detailPanel" id="detailPanel" hidden>
                    <div class="selectionCard">
                        <div>
                            <h2 id="selectionTitle">Choose an Apple Music playlist</h2>
                        </div>
                    </div>

                    <div class="actionGrid">
                        <button id="showAppleTracksButton" class="actionButton" type="button">
                            <span class="actionButtonTitle">Apple Music track list</span>
                        </button>
                        <button id="showYoutubeTracksButton" class="actionButton" type="button" disabled
                            title="Requires Google Firebase sign-in">
                            <span class="actionButtonTitle">YouTube Music equivalent</span>
                        </button>
                        <button id="showComparisonButton" class="actionButton" type="button" disabled
                            title="Requires Google Firebase sign-in">
                            <span class="actionButtonTitle">Compare track lists</span>
                        </button>
                    </div>

                    <section id="tracksView" hidden>
                        <div class="contentHeader">
                            <div>
                                <p id="trackSummary">Track data will appear here.</p>
                            </div>
                            <div class="contentActions">
                                <button id="copyTracksButton" class="secondaryButton" type="button" disabled>Copy full
                                    tracklist</button>
                                <div id="copyFeedback" class="copyFeedback" aria-live="polite"></div>
                            </div>
                        </div>

                        <table id="tracksTable" hidden>
                            <thead>
                                <tr>
                                    <th class="trackIndexHeader">#</th>
                                    <th>Track</th>
                                    <th>Artist</th>
                                    <th>Album</th>
                                    <th>Length</th>
                                </tr>
                            </thead>
                            <tbody id="tracksBody"></tbody>
                        </table>
                        <div id="pagination" hidden>
                            <button id="prevPage" type="button">Previous</button>
                            <span id="pageInfo"></span>
                            <button id="nextPage" type="button">Next</button>
                        </div>
                    </section>

                    <section id="comparisonView" class="comparisonView" hidden></section>
                </section>
            </div>
        </section>
    </main>
</body>

</html>
